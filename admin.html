<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Rahat Khan</title>
<link rel="icon" href="/images/rahat.png">
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="header"></div>
<main class="container" id="view"></main>
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/app.js"></script>
<script>
mountChrome();
const view = $("#view");
const nav = (h) => { history.pushState(null, "", location.pathname + (h ? "#" + h : "")); render(); };
document.addEventListener("click", (e) => { const a = e.target.closest("[data-nav]"); if (a) { e.preventDefault(); nav(a.dataset.nav); } });
window.addEventListener("popstate", render);
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") render(); });

async function render() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return loginView();
  const h = location.hash.slice(1);
  if (h === "new") return editorView();
  if (h.startsWith("edit/")) return editorView(h.slice(5));
  return dashView();
}

/* ---- Login ---- */
function loginView() {
  view.innerHTML = `<div class="panel login"><h1>Admin sign in</h1><p class="muted" style="margin:0 0 20px">Enter your username and password.</p>
    <div class="field"><label>Username</label><input class="input" id="u" autocapitalize="none" autocomplete="username"></div>
    <div class="field"><label>Password</label><input class="input" id="pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="e"></div><button class="btn btn-primary" id="go" style="width:100%;justify-content:center">Sign in</button></div>`;
  const go = async () => {
    let u = $("#u").value.trim(); if (!u) return;
    if (!u.includes("@")) u += CONFIG.EMAIL_DOMAIN;
    $("#go").disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: u, password: $("#pw").value });
    if (error) { $("#e").textContent = "Incorrect username or password."; $("#go").disabled = false; }
  };
  $("#go").onclick = go; $("#pw").onkeydown = (e) => e.key === "Enter" && go();
}

/* ---- Dashboard ---- */
async function dashView() {
  view.innerHTML = `<div class="skeleton" style="margin-top:40px"></div>`;
  const { data = [], error } = await sb.from("posts").select("*").order("created_at", { ascending: false });
  const live = data.filter((p) => p.published).length;
  view.innerHTML = `<div class="toolbar"><h1>Dashboard</h1><div class="actions">
      <button class="btn btn-primary" data-nav="new">+ New post</button>
      <button class="btn btn-ghost" id="out">Sign out</button></div></div>
    <div class="stats"><div class="stat"><b>${data.length}</b><span class="muted">Total</span></div>
      <div class="stat"><b>${live}</b><span class="muted">Published</span></div>
      <div class="stat"><b>${data.length - live}</b><span class="muted">Drafts</span></div></div>
    ${error ? `<p class="err">${esc(error.message)}</p>` : ""}
    <div class="list">${data.map((p) => {
      const img = p.cover_image_url || (p.images && p.images[0]);
      return `<div class="item">${img ? `<img class="mini" src="${esc(img)}" alt="">` : `<div class="mini"></div>`}
        <div class="grow"><div class="item-title">${esc(p.title)}<span class="badge ${p.published ? "live" : "draft"}">${p.published ? "Published" : "Draft"}</span></div>
        <div class="muted">${fmtDate(p.created_at)}</div></div>
        <div class="actions">
          <a class="btn btn-ghost btn-sm" href="${postPath(p.slug)}" target="_blank">View</a>
          <button class="btn btn-ghost btn-sm" data-nav="edit/${p.id}">Edit</button>
          <button class="btn btn-ghost btn-sm" data-cp="${esc(p.slug)}">Copy link</button>
          <button class="btn btn-ghost btn-sm" data-pub="${p.id}" data-v="${p.published}">${p.published ? "Unpublish" : "Publish"}</button>
          <button class="btn btn-danger btn-sm" data-del="${p.id}">Delete</button></div></div>`;
    }).join("") || `<div class="empty">No posts yet. Create your first one!</div>`}</div>`;

  $("#out").onclick = () => sb.auth.signOut();
  view.querySelectorAll("[data-cp]").forEach((b) => (b.onclick = () => copy(postUrl(b.dataset.cp))));
  view.querySelectorAll("[data-pub]").forEach((b) => (b.onclick = async () => {
    await sb.from("posts").update({ published: b.dataset.v !== "true" }).eq("id", b.dataset.pub);
    toast(b.dataset.v === "true" ? "Moved to drafts" : "Published ✓"); dashView();
  }));
  view.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Delete this post permanently?")) return;
    await sb.from("posts").delete().eq("id", b.dataset.del); toast("Post deleted"); dashView();
  }));
}

/* ---- Editor ---- */
async function editorView(id) {
  let p = { title: "", content: "", cover_image_url: "", images: [], published: true };
  if (id) { const { data } = await sb.from("posts").select("*").eq("id", id).maybeSingle(); if (data) p = data; }
  view.innerHTML = `<div class="toolbar"><h1>${id ? "Edit post" : "New post"}</h1><button class="btn btn-ghost" data-nav="">← Back</button></div>
  <div class="panel">
    <div class="field"><label>Title</label><input class="input" id="t" value="${esc(p.title)}" placeholder="Post title"></div>
    <div class="field"><label>Cover image link <span class="muted">(optional)</span></label>
      <input class="input" id="c" value="${esc(p.cover_image_url || "")}" placeholder="https://example.com/photo.jpg"></div>
    <div class="field"><label>Article</label>
      <div class="tabs"><button class="tab on" data-tab="w">Write</button><button class="tab" data-tab="p">Preview</button></div>
      <textarea class="input" id="b" style="min-height:260px" placeholder="Write here… Markdown supported. Leave empty for a photo-only post.">${esc(p.content || "")}</textarea>
      <div class="prose panel" id="pv" style="display:none"></div>
      <div class="hint">Tip: put an image inside text with <code>![caption](image-link)</code></div></div>
    <div class="field"><label>Image links <span class="muted">(one per line, shown as a gallery)</span></label>
      <textarea class="input" id="i" placeholder="https://...jpg">${esc((p.images || []).join("\n"))}</textarea>
      <div class="thumbs" id="th"></div></div>
    <div class="field"><label>Status</label><select class="input" id="s"><option value="1" ${p.published ? "selected" : ""}>Published</option><option value="0" ${p.published ? "" : "selected"}>Draft</option></select></div>
    <div class="err" id="e"></div>
    <div class="actions"><button class="btn btn-primary" id="save">Save post</button><button class="btn btn-ghost" data-nav="">Cancel</button></div>
  </div>`;

  const thumbs = () => {
    const urls = [$("#c").value.trim(), ...lines($("#i").value)].filter(Boolean);
    $("#th").innerHTML = urls.map((u) => `<img src="${esc(u)}" alt="" onerror="this.outerHTML='<span class=err>⚠ Broken link</span>'">`).join("");
  };
  $("#c").oninput = $("#i").oninput = thumbs; thumbs();

  view.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => {
    const prev = b.dataset.tab === "p";
    view.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
    $("#b").style.display = prev ? "none" : ""; $("#pv").style.display = prev ? "" : "none";
    if (prev) $("#pv").innerHTML = DOMPurify.sanitize(marked.parse($("#b").value || "*Nothing to preview*"));
  }));

  $("#save").onclick = async () => {
    const title = $("#t").value.trim(), content = $("#b").value.trim(), cover = $("#c").value.trim(), images = lines($("#i").value);
    const err = (m) => ($("#e").textContent = m);
    if (!title) return err("Please add a title.");
    if (!content && !cover && !images.length) return err("Add some text or at least one image link.");
    if ([cover, ...images].filter(Boolean).some((u) => !isUrl(u))) return err("Image links must start with http:// or https://");
    $("#save").disabled = true; err("");
    const row = { title, content, cover_image_url: cover || null, images, published: $("#s").value === "1", updated_at: new Date().toISOString() };
    let res;
    if (id) res = await sb.from("posts").update(row).eq("id", id);
    else {
      let slug = slugify(title);
      const { data: ex } = await sb.from("posts").select("id").eq("slug", slug).maybeSingle();
      if (ex) slug += "-" + Date.now().toString(36).slice(-4);
      res = await sb.from("posts").insert({ ...row, slug });
    }
    if (res.error) { err(res.error.message); $("#save").disabled = false; return; }
    toast("Saved ✓"); nav("");
  };
}
render();
</script>
</body>
</html>
