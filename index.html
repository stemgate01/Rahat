<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahat Khan — Blog</title>
<meta name="description" content="Thoughts, stories and ideas by Rahat Khan.">
<meta property="og:image" content="/images/rahat.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Rahat Khan — Blog">
<meta property="og:description" content="Thoughts, stories and ideas by Rahat Khan.">
<link rel="icon" href="/images/rahat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="header"></div>
<main id="main" class="container" tabindex="-1">
  <section class="masthead">
    <div class="mast-text">
      <span class="eyebrow">Personal blog</span>
      <h1 id="h-name"></h1>
      <div class="search-wrap">
        <span class="search-ico" id="qi"></span>
        <input class="input search" id="q" type="search" placeholder="Search articles" aria-label="Search articles" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search-clear" id="qc" aria-label="Clear search" hidden></button>
      </div>
      <div class="mast-social" id="mast-social"></div>
    </div>
  </section>

  <div class="section-head">
    <h2>Latest articles</h2>
    <span class="muted" id="count" aria-live="polite"></span>
  </div>

  <div id="list" aria-busy="true">
    <div class="grid" aria-hidden="true">
      <div class="sk-card"><div class="sk img"></div><div class="sk line s"></div><div class="sk line l"></div><div class="sk line m"></div></div>
      <div class="sk-card"><div class="sk img"></div><div class="sk line s"></div><div class="sk line l"></div><div class="sk line m"></div></div>
      <div class="sk-card"><div class="sk img"></div><div class="sk line s"></div><div class="sk line l"></div><div class="sk line m"></div></div>
    </div>
  </div>
  <noscript><p class="muted">JavaScript is required to load articles.</p></noscript>
</main>
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/app.js"></script>
<script>
mountChrome("home");
$("#h-name").textContent = CONFIG.TAGLINE;
$("#qi").innerHTML = icon("search", 18);
$("#qc").innerHTML = icon("close", 16);
$("#mast-social").innerHTML = (CONFIG.SOCIAL || []).filter((x) => x.type !== "email" && /^https?:/i.test(x.url))
  .map((x) => `<a class="chip" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${icon(x.type, 16)}<span>${esc({ tiktok: "TikTok", instagram: "Instagram", facebook: "Facebook" }[x.type] || x.type)}</span></a>`).join("");

const list = $("#list"), count = $("#count"), input = $("#q"), clearBtn = $("#qc");
let posts = [];

function showState(iconName, title, text, btnId, btnLabel) {
  list.setAttribute("aria-busy", "false");
  list.innerHTML = `<div class="empty">${icon(iconName, 32)}<h3>${esc(title)}</h3><p>${esc(text)}</p>
    ${btnId ? `<button type="button" class="btn btn-ghost" id="${btnId}">${esc(btnLabel)}</button>` : ""}</div>`;
}

function draw(items, query) {
  list.setAttribute("aria-busy", "false");
  count.textContent = items.length
    ? `${items.length} ${query ? (items.length === 1 ? "result" : "results") : (items.length === 1 ? "article" : "articles")}`
    : "";

  if (!items.length) {
    if (query) {
      showState("search", "No articles found", `Nothing matches "${query}". Check the spelling or try another word.`, "reset", "Clear search");
      $("#reset").onclick = clearSearch;
    } else {
      showState("file", "No articles yet", "New articles will appear here once they are published.");
    }
    return;
  }

  const featured = query ? null : items[0];
  const rest = query ? items : items.slice(1);
  list.innerHTML =
    (featured ? featureHTML(featured) : "") +
    (rest.length ? `<div class="grid">${rest.map(cardHTML).join("")}</div>` : "");
}

async function load() {
  try {
    if (!sb) throw new Error("offline");
    const { data, error } = await sb
      .from("posts")
      .select("id,title,slug,content,cover_image_url,images,created_at")
      .eq("published", true)
      .order("created_at", { ascending: false });
    if (error) throw error;
    posts = (data || []).map((p) => ({ ...p, _s: (p.title + " " + plain(p.content)).toLowerCase() }));
    draw(posts, "");
  } catch (e) {
    showState("alert", "Couldn't load articles", "Check your connection and try again.", "retry", "Try again");
    $("#retry").onclick = () => {
      if (!window.supabase) return location.reload();
      list.setAttribute("aria-busy", "true");
      load();
    };
  }
}

function clearSearch() {
  input.value = "";
  clearBtn.hidden = true;
  draw(posts, "");
  input.focus();
}

input.addEventListener("input", () => {
  const q = input.value.trim();
  clearBtn.hidden = !input.value;
  if (!posts.length) return;
  draw(q ? posts.filter((p) => p._s.includes(q.toLowerCase())) : posts, q);
});
clearBtn.onclick = clearSearch;

load();
if (location.hash === "#search") { input.focus(); input.scrollIntoView({ block: "center" }); }
addEventListener("hashchange", () => { if (location.hash === "#search") input.focus(); });
</script>
</body>
</html>
